{% extends 'base.html' %}

{% block title %}Profile | Skillora{% endblock %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-4">
        <div class="card p-4 text-center">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 90px; height: 90px; font-size: 2rem;">
                {{ student.name|first }}
            </div>
            <h3>{{ student.name }}</h3>
            <p class="text-muted mb-0">{{ student.major }}</p>
            <p class="text-muted">{{ student.year }}</p>
            <span class="score-pill">{{ student.readiness_score }}% ready</span>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card p-4">
            <h4 class="section-title">Profile details</h4>
            <form>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full name</label>
                        <input class="form-control" value="{{ student.name }}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" value="student@example.com" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Degree</label>
                        <input class="form-control" value="{{ student.major }}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input class="form-control" value="{{ student.location }}" />
                    </div>
                    <div class="col-12">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control" rows="4">CS student focused on AI, product design, and building practical solutions for social impact.</textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Resume upload</label>
                        <input type="file" class="form-control" />
                    </div>
                </div>
                <div class="mt-4">
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
