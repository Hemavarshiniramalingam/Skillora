<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Skillora{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #07111f;
            --bg-soft: #101b2d;
            --panel: #111f31;
            --panel-2: #162844;
            --border: rgba(148, 163, 184, 0.18);
            --text: #e5ecf8;
            --muted: #9fb0c8;
            --primary: #6ea8fe;
            --primary-strong: #4f8df7;
            --success: #5ad1a0;
            --warning: #f7c66a;
            --danger: #ff7b7b;
        }

        body {
            background: radial-gradient(circle at top, #0d1b2a 0%, var(--bg) 48%);
            color: var(--text);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(8, 16, 28, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand, .nav-link, .navbar-text {
            color: #fff !important;
        }

        .nav-link {
            opacity: 0.8;
        }

        .nav-link:hover {
            opacity: 1;
        }

        .card {
            background: linear-gradient(180deg, rgba(17, 31, 49, 0.96), rgba(11, 20, 33, 0.98));
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
            color: var(--text);
        }

        .text-muted {
            color: var(--muted) !important;
        }

        .score-pill {
            background: rgba(110, 168, 254, 0.15);
            color: #cfe0ff;
            border: 1px solid rgba(110, 168, 254, 0.4);
            border-radius: 999px;
            padding: 6px 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 1rem;
            color: #f0f6ff;
        }

        .progress {
            background-color: rgba(148, 163, 184, 0.15);
            border-radius: 999px;
        }

        .progress-bar {
            border-radius: 999px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            border: none;
        }

        .btn-primary:hover {
            filter: brightness(1.08);
        }

        .btn-outline-primary {
            color: #dfeeff;
            border-color: rgba(110, 168, 254, 0.65);
        }

        .btn-outline-primary:hover {
            background: rgba(110, 168, 254, 0.12);
            border-color: rgba(110, 168, 254, 0.8);
            color: white;
        }

        .bg-light {
            background: rgba(19, 35, 52, 0.9) !important;
            color: var(--text) !important;
        }

        .badge {
            border-radius: 999px;
        }

        .form-control, .form-select, textarea {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .form-control::placeholder {
            color: #8ea2bd;
        }

        .border {
            border-color: var(--border) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">Skillora</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'internships' %}">Internships</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'scholarships' %}">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'tracker' %}">Tracker</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
